services:
  - type: web
    name: create-diet-api
    runtime: node
    plan: free
    buildCommand: "npm ci --include=dev && npm run build"
    startCommand: "npm run start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.14.1"
      - key: JSON_BODY_LIMIT
        value: "1mb"
      - key: CORS_CREDENTIALS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: MONGO_DB_CONNECTION_STRING
        sync: false
      - key: MONGO_DB_DATABASE_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        sync: false
      - key: SEARCH_HASH_KEY
        sync: false
      - key: REDIS_URL
        sync: false
